name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run build
      - run: npm run smoke
      - run: npx publint --strict
      - run: npx @arethetypeswrong/cli --pack .
      # Named explicitly. A bare name matches every file containing it, which is how
      # shadow-dom-real-chrome reached a runner with no display. The specs guard
      # themselves too, but CI should not be asking for them in the first place.
      - run: npx playwright test tests/specs/unshielded.spec.ts tests/specs/shielded.spec.ts tests/specs/comparison.spec.ts tests/specs/merge-text.spec.ts tests/specs/shadow-dom.spec.ts tests/specs/conflicts.spec.ts tests/specs/replace-child.spec.ts tests/specs/stop.spec.ts tests/specs/recorder.spec.ts tests/specs/save-into-repo.spec.ts
